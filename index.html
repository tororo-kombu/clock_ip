<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7セグ時計</title>
<style>
  /* 1rem = 16:9領域の横幅の1% (JSで設定。未実行時の代替は1vw) */
  html { font-size: 1vw; height: 100%; background: #000; }
  body { margin: 0; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #stage {
    width: 100rem; height: 56.25rem; background: #000; color: hsl(0, 100%, 55%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-transition: color .8s; transition: color .8s;
  }
  .row { display: flex; align-items: center; justify-content: center; }
  .row > * + * { margin-left: 1rem; }
  #date { margin-bottom: 3.5rem; }
  .digit { display: block; height: 10rem; width: 6rem; }
  .time .digit { height: 20rem; width: 12rem; }
  .time > * + * { margin-left: 1.6rem; }
  .sec { display: flex; align-self: flex-end; }
  .sec > * + * { margin-left: 1rem; }
  .time .sec .digit { height: 9rem; width: 5.4rem; }
  .digit path { fill: currentColor; opacity: .07; }
  .digit path.on { opacity: 1; }
  .unit { font-size: 4.4rem; font-weight: 700; }
  .row > .week { margin-left: 3rem; }
  .week > * + * { margin-left: 1rem; }
  .colon { width: 3rem; height: 20rem; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .colon i { width: 1.8rem; height: 1.8rem; background: currentColor; display: block; margin: 2.5rem 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="row" id="date"></div>
  <div class="row time" id="time"></div>
</div>
<script>
(function () {
  // 画面サイズに合わせて16:9領域をフィット
  function fit() {
    var w = Math.min(window.innerWidth, window.innerHeight * 16 / 9);
    document.documentElement.style.fontSize = (w / 100) + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  var MAP = ["abcdef","bc","abdeg","abcdg","bcfg","acdfg","acdefg","abc","abcdefg","abcdfg"];
  var PATHS = {
    a: "M12 10 L18 4 L42 4 L48 10 L42 16 L18 16 Z",
    g: "M12 50 L18 44 L42 44 L48 50 L42 56 L18 56 Z",
    d: "M12 90 L18 84 L42 84 L48 90 L42 96 L18 96 Z",
    f: "M8 13 L14 19 L14 41 L8 47 L2 41 L2 19 Z",
    b: "M52 13 L58 19 L58 41 L52 47 L46 41 L46 19 Z",
    e: "M8 53 L14 59 L14 81 L8 87 L2 81 L2 59 Z",
    c: "M52 53 L58 59 L58 81 L52 87 L46 81 L46 59 Z"
  };
  var NS = "http://www.w3.org/2000/svg";

  function makeDigit(parent) {
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 60 100");
    svg.setAttribute("class", "digit");
    var segs = {};
    "abcdefg".split("").forEach(function (k) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", PATHS[k]);
      svg.appendChild(p);
      segs[k] = p;
    });
    parent.appendChild(svg);
    return {
      set: function (n) {
        var on = MAP[n];
        for (var k in segs) segs[k].setAttribute("class", on.indexOf(k) >= 0 ? "on" : "");
      }
    };
  }

  // 16セグメント
  var P16 = {
    a1: "M12 10 L18 4 L28 4 L28 16 L18 16 Z",
    a2: "M32 4 L42 4 L48 10 L42 16 L32 16 Z",
    g1: "M12 50 L18 44 L28 44 L28 56 L18 56 Z",
    g2: "M32 44 L42 44 L48 50 L42 56 L32 56 Z",
    d1: "M12 90 L18 84 L28 84 L28 96 L18 96 Z",
    d2: "M32 84 L42 84 L48 90 L42 96 L32 96 Z",
    f: PATHS.f, b: PATHS.b, e: PATHS.e, c: PATHS.c,
    i: "M26 19 L34 19 L34 41 L26 41 Z",
    l: "M26 59 L34 59 L34 81 L26 81 Z",
    h: "M16 19 L22 19 L28 40 L22 40 Z",
    j: "M44 19 L38 19 L32 40 L38 40 Z",
    k: "M22 60 L28 60 L22 81 L16 81 Z",
    m: "M32 60 L38 60 L44 81 L38 81 Z"
  };
  var M16 = {
    S: "a1 a2 f g1 g2 c d1 d2", U: "b c d1 d2 e f", N: "b c e f h m",
    M: "b c e f h j", O: "a1 a2 b c d1 d2 e f", T: "a1 a2 i l",
    E: "a1 a2 d1 d2 e f g1", W: "b c e f k m", D: "a1 a2 b c d1 d2 i l",
    H: "b c e f g1 g2", F: "a1 a2 e f g1 g2", R: "a1 a2 b e f g1 g2 m",
    I: "a1 a2 d1 d2 i l", A: "a1 a2 b c e f g1 g2"
  };
  function makeChar16(parent) {
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 60 100");
    svg.setAttribute("class", "digit");
    var segs = {};
    Object.keys(P16).forEach(function (k) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", P16[k]);
      svg.appendChild(p);
      segs[k] = p;
    });
    parent.appendChild(svg);
    return {
      set: function (ch) {
        var on = (M16[ch] || "").split(" ");
        for (var k in segs) segs[k].setAttribute("class", on.indexOf(k) >= 0 ? "on" : "");
      }
    };
  }

  function unit(parent, text) {
    var s = document.createElement("span");
    s.className = "unit"; s.textContent = text;
    parent.appendChild(s);
  }
  function colon(parent) {
    var d = document.createElement("div");
    d.className = "colon"; d.innerHTML = "<i></i><i></i>";
    parent.appendChild(d);
  }
  function group(parent, n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(makeDigit(parent));
    return a;
  }

  var dateEl = document.getElementById("date");
  var timeEl = document.getElementById("time");

  var M = group(dateEl, 2); unit(dateEl, "月");
  var D = group(dateEl, 2); unit(dateEl, "日");

  var weekEl = document.createElement("div"); weekEl.className = "row week"; dateEl.appendChild(weekEl);
  var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  var W = [makeChar16(weekEl), makeChar16(weekEl), makeChar16(weekEl)];

  var H = group(timeEl, 2); colon(timeEl);
  var Mi = group(timeEl, 2); colon(timeEl);
  var secEl = document.createElement("div"); secEl.className = "sec"; timeEl.appendChild(secEl);
  var S = group(secEl, 2);

  function put(arr, v) {
    var s = String(v);
    while (s.length < arr.length) s = "0" + s;
    arr.forEach(function (d, i) { d.set(+s.charAt(i)); });
  }

  var stage = document.getElementById("stage");
  var lastWd = -1, lastHour = -1;

  function tick() {
    var t = new Date();
    put(M, t.getMonth() + 1); put(D, t.getDate());
    put(H, t.getHours()); put(Mi, t.getMinutes()); put(S, t.getSeconds());
    if (t.getDay() !== lastWd) {
      lastWd = t.getDay();
      W.forEach(function (c, i) { c.set(DAYS[lastWd].charAt(i)); });
    }
    if (t.getHours() !== lastHour) {
      lastHour = t.getHours();
      // 時間ごとに色相を変更 (24色)
      stage.style.color = "hsl(" + (lastHour * 15) + ", 100%, 55%)";
    }
  }
  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
